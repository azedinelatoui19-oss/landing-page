<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مناحل الفاخر ترحب بك</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f4f7f6; margin: 0; padding: 50px; display: flex; justify-content: center; }
        .form-container { background: #ffffff; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        h2 { text-align: center; color: #333; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #555; font-weight: bold; }
        input[type="text"], input[type="tel"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { background-color: #28a745; color: white; border: none; padding: 12px; width: 100%; border-radius: 5px; font-size: 16px; cursor: pointer; }
        button:hover { background-color: #218838; }
        #message { margin-top: 15px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>سجل بياناتك معنا</h2>
    <form id="landingForm">
        <div class="form-group">
            <label for="fullName">الاسم واللقب:</label>
            <input type="text" id="fullName" name="fullName" required>
        </div>
        
        <div class="form-group">
            <label for="addressInfo">العنوان، الولاية والبلدية:</label>
            <input type="text" id="addressInfo" name="addressInfo" required placeholder="مثلاً: حي الموقف، ولاية الجلفة، بلدية حد الصحاري">
        </div>
        
        <div class="form-group">
            <label for="phone">رقم الهاتف:</label>
            <input type="tel" id="phone" name="phone" required>
        </div>
        
        <button type="submit" id="submitBtn">إرسال البيانات</button>
    </form>
    <div id="message"></div>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbwJWo1kHL1281E8JiGhPR60_0zbdwiu6RV2nrkFRcTwbSsDVs55Zz_A8z3L_ybgKsJT/exec'; // ضع رابط جوجل آابس سكريبت هنا بين علامتي التنصيص
    const form = document.getElementById('landingForm');
    const messageDiv = document.getElementById('message');

    form.addEventListener('submit', e => {
        e.preventDefault();
        document.getElementById('submitBtn').disabled = true;
        document.getElementById('submitBtn').innerText = 'جاري الإرسال...';

        const requestData = {
            fullName: document.getElementById('fullName').value,
            addressInfo: document.getElementById('addressInfo').value,
            phone: document.getElementById('phone').value
        };

        fetch(scriptURL, {
            method: 'POST',
            mode: 'no-cors', // لتجنب مشاكل الصلاحيات في المتصفح
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(requestData)
        })
        .then(() => {
            messageDiv.style.color = 'green';
            messageDiv.innerText = 'تم إرسال بياناتك بنجاح!';
            form.reset();
            document.getElementById('submitBtn').disabled = false;
            document.getElementById('submitBtn').innerText = 'إرسال البيانات';
        })
        .catch(error => {
            messageDiv.style.color = 'red';
            messageDiv.innerText = 'حدث خطأ، يرجى المحاولة مرة أخرى.';
            document.getElementById('submitBtn').disabled = false;
            document.getElementById('submitBtn').innerText = 'إرسال البيانات';
        });
    });
</script>

</body>
</html>
